<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stone Paper Scissor</title>
</head>
<style>
    header{
        background-color: rgba(0, 0, 0, .5);
        top: 0;
        width: 100%;
        height: 18vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    header h1{
        
        color: bisque;
    }
    *{
        font-family: sans-serif;
        box-sizing: border-box;
        font-weight: bold;
        margin: 0;
        padding: 0;
    }
    body{
        background-color: bisque;
    }
    section{
        display: flex;
        justify-content: space-evenly;
        align-items: center;
        margin-top: 100px;
    }
    div{
        border-radius: 14px;
        border: 4px solid burlywood;
        height: 23vh;
        width: 14vw;
        align-items: center;
        display: flex;
        justify-content: center;
        background-color: bisque;
        color: rgb(68, 68, 68);
        transition: 0.4s ease-in-out;
    }
    div:hover{
        cursor: pointer;
        color: bisque;
        background-color: rgb(68, 68, 68);
    }
    h1{
        text-align: center;
        align-self: center;
        color: rgb(68, 68, 68);
        font-size: 5vh;
    
    }
    @media screen and (max-width: 600px){
        section{
            flex-direction: column;
        }
        
    
        header{
            height: 15vh;
        }

    }
</style>
<body>


    <header>
        <h1>ROCK PAPER SCISSOR</h1>
    </header>



    <section>
    <div onclick="
      
    let randomNumber = Math.random();
    let myval = 'Rock';
    let compval = '';
    let result = '';
    

    if(randomNumber >= 0 && randomNumber < 1/3){
        compval = 'Rock';
    }else if(randomNumber >= 1/3 && randomNumber < 2/3){
        compval = 'Paper';
    }else if(randomNumber >= 2/3 && randomNumber < 1){
        compval = 'Scissor';
    }

    if(compval === 'Rock'){
        result = 'Tie';
    }else if(compval === 'Paper'){
        result = 'Loose';
    }else if(compval === 'Scissor'){
        result = 'Win';
    }
      const finalresult = `You picked ${myval},\nComputer picked ${compval},\nSo its a ${result}`;
      alert(finalresult);
      ">ROCK</div>


 


    <div onclick="
      
    let randomNumber = Math.random();
    let myval = 'Paper';
    let compval = '';
    let result = '';
    

    if(randomNumber >= 0 && randomNumber < 1/3){
        compval = 'Rock';
    }else if(randomNumber >= 1/3 && randomNumber < 2/3){
        compval = 'Paper';
    }else if(randomNumber >= 2/3 && randomNumber < 1){
        compval = 'Scissor';
    }

    if(compval === 'Rock'){
        result = 'Win';
    }else if(compval === 'Paper'){
        result = 'Tie';
    }else if(compval === 'Scissor'){
        result = 'Loose';
    }
      const finalresult = `You picked ${myval},\nComputer picked ${compval},\nSo its a ${result}`;
      alert(finalresult);

      ">PAPER</div>




    <div onclick="
      
    let randomNumber = Math.random();
    let myval = 'Scissor';
    let compval = '';
    let result = '';
    

    if(randomNumber >= 0 && randomNumber < 1/3){
        compval = 'Rock';
    }else if(randomNumber >= 1/3 && randomNumber < 2/3){
        compval = 'Paper';
    }else if(randomNumber >= 2/3 && randomNumber < 1){
        compval = 'Scissor';
    }

    if(compval === 'Rock'){
        result = 'Loose';
    }else if(compval === 'Paper'){
        result = 'Win';
    }else if(compval === 'Scissor'){
        result = 'Tie';
    }
      const finalresult = `You picked ${myval},\nComputer picked ${compval},\nSo its a ${result}`;
      alert(finalresult);

      ">SCISSOR</div>

    </section>
    
</body>
<script>
    
    console.log(randno);
</script>
</html>
