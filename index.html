<!DOCTYPE html>
<html lang = "en">
    <head>
    
    <meta charset = "UTF-8">
    <meta name    = "viewport" content = "width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
<style>  
  header{
        background-color: rgba(0, 0, 0, .5);
        top             : 0;
        width           : 100%;
        height          : 18vh;
        display         : flex;
        text-align      : center;
        align-items     : center;
        justify-content : center;
    }
    .title{
        
        font-size: 5vh;
        color    : bisque;
    }
    *{
        font-family: sans-serif;
        box-sizing : border-box;
        font-weight: bold;
        margin     : 0;
        padding    : 0;
    }
    body{
        background-color: bisque;
    }
    section{
        display        : flex;
        justify-content: space-evenly;
        align-items    : center;
        margin-top     : 100px;
    }
    div{
        
        border-radius   : 14px;
        border          : 4px solid burlywood;
        height          : 20vh;
        width           : 18vw;
        align-items     : center;
        display         : flex;
        justify-content : center;
        background-color: bisque;
        color           : rgb(68, 68, 68);
        transition      : 0.4s ease-in-out;
    }
    div:hover{
        cursor          : pointer;
        color           : bisque;
        background-color: rgb(68, 68, 68);
    }
    div h1{
        font-size : 2.6vh;
        text-align: center;
        align-self: center;
    
    }
    @media screen and (max-width: 450px){
        section{
            display       : flex;
            flex-direction: column;
            gap           : 40px;
        }
        div{
            height: 14vh;
            width : 38vw;
        }
        div h1{
            font-size: 2.6vh;
        }
    
        header{
            height: 15vh;
        }
        .title{
            font-size: 2.7vh;
        }
        #hide{
        margin-top: 10px;
        font-size : 603vw;
        height    : 35vh;
        width     : 33vw;
        }

    }
    #hide {
        display         : none;
        border-radius   : 14px;
        border          : 4px solid burlywood;
        height          : 35vh;
        width           : 63vw;
        flex-direction  : column;
        align-items     : center;
        justify-content : center;
        background-color: bisque;
        color           : rgb(68, 68, 68);
        transition      : 0.4s ease-in-out;
        font-size       : 1.1vw;
    }
    #hide:hover{
        cursor          : pointer;
        color           : bisque;
        background-color: rgb(68, 68, 68);
    }
    #hide button{
        border          : 1px solid burlywood;
        border-radius   : 9px;
        height: 30px;
        width: 100px;
        background-color: bisque;
        color           : rgb(68, 68, 68);
        transition      : 0.4s ease-in-out;
    }
    #hide button:hover{
        cursor          : pointer;
        color           : bisque;
        background-color: rgb(68, 68, 68);
    }

    </style>
    </head>

<body>


    <header>
        <h1 class = "title">ROCK  PAPER  SCISSOR</h1>
    </header>



    <section>
    <div id="div1" onclick="
      

            hider()




    let randomNumber = Math.random();
    let myval        = 'Rock';
    let compval      = '';
    let result       = '';
    

    if(randomNumber &gt;= 0 &amp;&amp; randomNumber &lt; 1/3){
        compval = 'Rock';
    }else if(randomNumber &gt;= 1/3 &amp;&amp; randomNumber &lt; 2/3){
        compval = 'Paper';
    }else if(randomNumber &gt;= 2/3 &amp;&amp; randomNumber &lt; 1){
        compval = 'Scissor';
    }

    if(compval === 'Rock'){
        result = 'Tie';
    }else if(compval === 'Paper'){
        result = 'Loose';
    }else if(compval === 'Scissor'){
        result = 'Win';
    }
      const                   finalresult         = `You picked ${myval},\nComputer picked ${compval},\nSo its a ${result}`;
      document.getElementById('result').innerText = finalresult;
      "><h1>ROCK</h1></div>


 


    <div id="div2" onclick="
      

        hider()




    let randomNumber = Math.random();
    let myval        = 'Paper';
    let compval      = '';
    let result       = '';
    

    if(randomNumber &gt;= 0 &amp;&amp; randomNumber &lt; 1/3){
        compval = 'Rock';
    }else if(randomNumber &gt;= 1/3 &amp;&amp; randomNumber &lt; 2/3){
        compval = 'Paper';
    }else if(randomNumber &gt;= 2/3 &amp;&amp; randomNumber &lt; 1){
        compval = 'Scissor';
    }

    if(compval === 'Rock'){
        result = 'Win';
    }else if(compval === 'Paper'){
        result = 'Tie';
    }else if(compval === 'Scissor'){
        result = 'Loose';
    }
      const                   finalresult         = `You picked ${myval},\nComputer picked ${compval},\nSo its a ${result}`;
      document.getElementById('result').innerText = finalresult;

      "><h1>PAPER</h1></div>




    <div id="div3" onclick="
      

        hider()




    let randomNumber = Math.random();
    let myval        = 'Scissor';
    let compval      = '';
    let result       = '';
    

    if(randomNumber &gt;= 0 &amp;&amp; randomNumber &lt; 1/3){
        compval = 'Rock';
    }else if(randomNumber &gt;= 1/3 &amp;&amp; randomNumber &lt; 2/3){
        compval = 'Paper';
    }else if(randomNumber &gt;= 2/3 &amp;&amp; randomNumber &lt; 1){
        compval = 'Scissor';
    }

    if(compval === 'Rock'){
        result = 'Loose';
    }else if(compval === 'Paper'){
        result = 'Win';
    }else if(compval === 'Scissor'){
        result = 'Tie';
    }
      const                   finalresult         = `You picked ${myval},\nComputer picked ${compval},\nSo its a ${result}`;
      document.getElementById('result').innerText = finalresult;

      "><h1>SCISSOR</h1></div>

            <div    id      = "hide">
            <h1     id      = "result">your reslut comes here</h1>
            <br><br>
            <button onclick = "location.reload()">Try again!</button>
            </div>




    </section>

<script>

       function hider() {
    document.getElementById('div1').style.display = 'none';
    document.getElementById('div2').style.display = 'none';
    document.getElementById('div3').style.display = 'none';

    document.getElementById('hide').style.display = 'flex';
}

</script>
</body>
</html>
